<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Dipole Antennas -->
  <path d="M6 9V3.8" stroke="#2563EB" stroke-width="2" stroke-linecap="round" />
  <circle cx="6" cy="2.8" r="1.3" fill="#2563EB" />
  <path d="M18 9V3.8" stroke="#2563EB" stroke-width="2" stroke-linecap="round" />
  <circle cx="18" cy="2.8" r="1.3" fill="#2563EB" />

  <!-- Gateway Chassis with soft duotone fill -->
  <rect x="2.5" y="9" width="19" height="12" rx="2.5" stroke="#2563EB" stroke-width="2" fill="#2563EB" fill-opacity="0.12" />

  <!-- Ethernet / RS-485 Modbus Port -->
  <rect x="13.5" y="12.5" width="5.5" height="4.5" rx="1" stroke="#2563EB" stroke-width="1.5" fill="#2563EB" fill-opacity="0.2" />
  <line x1="15.5" y1="12.5" x2="15.5" y2="14.5" stroke="#2563EB" stroke-width="1" stroke-linecap="round" />
  <line x1="17" y1="12.5" x2="17" y2="14.5" stroke="#2563EB" stroke-width="1" stroke-linecap="round" />

  <!-- Colored Status LEDs (Power: Green, Data: Blue) -->
  <circle cx="6" cy="15" r="1.2" fill="#10B981" />
  <circle cx="9.5" cy="15" r="1.2" fill="#3B82F6" />
</svg>
